name: Browser player
on:
  pull_request:
    paths:
      - 'web/**'
      - 'src/protocol.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/player.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intro-spectrum:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test web/test/player.test.ts web/test/web.test.ts
      - run: bun run web:build
      - name: Install browser test tools
        run: |
          mkdir -p "$RUNNER_TEMP/nixamp-browser"
          bun add --cwd "$RUNNER_TEMP/nixamp-browser" playwright@1.63.0
          bun "$RUNNER_TEMP/nixamp-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Intro spectrum, autoplay and track handoff
        env:
          NIXAMP_PLAYWRIGHT_MODULE: ${{ runner.temp }}/nixamp-browser/node_modules/playwright/index.mjs
        run: bun web/scripts/check-intro.mjs

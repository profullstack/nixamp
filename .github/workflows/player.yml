name: Browser player
on:
  pull_request:
    paths:
      - 'web/**'
      - 'packages/long-string-scroller/**'
      - 'src/channels.ts'
      - 'src/fragments.ts'
      - 'src/playlist-input.ts'
      - 'test/playlist-stream.test.ts'
      - 'src/protocol.ts'
      - 'src/i18n.ts'
      - 'src/ui-languages.ts'
      - 'src/ui-aliases.ts'
      - 'src/locales/**'
      - 'test/i18n.test.ts'
      - 'backtoschool/**'
      - 'desktop/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/player.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intro-spectrum:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # The runner's Ubuntu mirror has crawled at ~40 KB/s (apt took 20+ min and
      # held three releases): a static ffmpeg from GitHub's own release storage
      # first, apt only if that fails.
      - name: Install media test tools
        timeout-minutes: 12
        run: |
          set -e
          url=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-linux64-gpl-9.0.tar.xz
          if curl -fsSL --retry 3 --max-time 180 "$url" -o "$RUNNER_TEMP/ffmpeg.tar.xz"; then
            mkdir -p "$RUNNER_TEMP/ffmpeg" && tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
            echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
            "$RUNNER_TEMP/ffmpeg/bin/ffmpeg" -version | head -1
          else
            sudo timeout 600 apt-get -o DPkg::Lock::Timeout=60 update
            sudo timeout 600 apt-get -o DPkg::Lock::Timeout=60 install -y --no-install-recommends ffmpeg
            ffmpeg -version | head -1
          fi
      - run: bun test test/playlist-stream.test.ts
      - run: bun test test/i18n.test.ts web/test/player.test.ts web/test/web.test.ts web/test/accessibility.test.ts
      - run: bun run web:build
      - run: bun run backtoschool:build
      - name: Install browser test tools
        run: |
          mkdir -p "$RUNNER_TEMP/nixamp-browser"
          bun add --cwd "$RUNNER_TEMP/nixamp-browser" playwright@1.63.0
          bun "$RUNNER_TEMP/nixamp-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Intro spectrum, autoplay and track handoff
        env:
          NIXAMP_PLAYWRIGHT_MODULE: ${{ runner.temp }}/nixamp-browser/node_modules/playwright/index.mjs
        run: bun web/scripts/check-intro.mjs
      - name: Interface language, select contrast and accessible live switching
        env:
          NIXAMP_PLAYWRIGHT_MODULE: ${{ runner.temp }}/nixamp-browser/node_modules/playwright/index.mjs
        run: bun web/scripts/check-interface.mjs
      - name: Unified parties, live updates and panel controls
        env:
          NIXAMP_PLAYWRIGHT_MODULE: ${{ runner.temp }}/nixamp-browser/node_modules/playwright/index.mjs
        run: bun web/scripts/check-parties.mjs
      - name: Real HLS playlist decoding across mixed source files
        env:
          NIXAMP_PLAYWRIGHT_MODULE: ${{ runner.temp }}/nixamp-browser/node_modules/playwright/index.mjs
        run: bun web/scripts/check-media-playlist.mjs
      - name: Live playlist row stability and mouse scrolling
        env:
          NIXAMP_PLAYWRIGHT_MODULE: ${{ runner.temp }}/nixamp-browser/node_modules/playwright/index.mjs
        run: bun web/scripts/check-playlist.mjs
      - name: Browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parties-browser
          path: /tmp/nixamp-parties-mobile.png
          if-no-files-found: ignore

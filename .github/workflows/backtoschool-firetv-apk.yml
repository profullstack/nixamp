name: Build BackToSchool Fire TV APK

on:
  push:
    branches:
      - main
    paths:
      - "backtoschool-firetv/**"
      - ".github/workflows/backtoschool-firetv-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Prepare release signing key
        id: signing
        shell: bash
        env:
          SAVED_KEYSTORE_BASE64: ${{ secrets.BACKTOSCHOOL_RELEASE_KEYSTORE_BASE64 }}
          SAVED_KEYSTORE_PASSWORD: ${{ secrets.BACKTOSCHOOL_RELEASE_KEYSTORE_PASSWORD }}
          SAVED_KEY_PASSWORD: ${{ secrets.BACKTOSCHOOL_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/backtoschool-release.p12"
          if [[ -n "$SAVED_KEYSTORE_BASE64" ]]; then
            [[ -n "$SAVED_KEYSTORE_PASSWORD" && -n "$SAVED_KEY_PASSWORD" ]]
            printf '%s' "$SAVED_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            store_password="$SAVED_KEYSTORE_PASSWORD"
            key_password="$SAVED_KEY_PASSWORD"
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            store_password="$(openssl rand -hex 24)"
            key_password="$store_password"
            keytool -genkeypair \
              -keystore "$keystore" \
              -storetype PKCS12 \
              -storepass "$store_password" \
              -keypass "$key_password" \
              -alias backtoschool \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10000 \
              -dname "CN=BackToSchool.help, O=ProFullStack, C=US"
            {
              echo "keystore=backtoschool-release.p12"
              echo "storeType=PKCS12"
              echo "alias=backtoschool"
              echo "storePassword=$store_password"
              echo "keyPassword=$key_password"
            } > "$RUNNER_TEMP/signing-key-info.txt"
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "BACKTOSCHOOL_KEYSTORE_PATH=$keystore"
            echo "BACKTOSCHOOL_KEYSTORE_PASSWORD=$store_password"
            echo "BACKTOSCHOOL_KEY_ALIAS=backtoschool"
            echo "BACKTOSCHOOL_KEY_PASSWORD=$key_password"
          } >> "$GITHUB_ENV"

      - name: Lint and build signed release
        working-directory: backtoschool-firetv
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lintRelease assembleRelease

      - name: Validate signed APK
        shell: bash
        run: |
          set -euo pipefail
          apk="backtoschool-firetv/app/build/outputs/apk/release/app-release.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$apksigner" verify --verbose --print-certs "$apk"
          "$aapt" dump badging "$apk" | tee "$RUNNER_TEMP/apk-badging.txt"
          mkdir -p "$RUNNER_TEMP/apk-release"
          cp "$apk" "$RUNNER_TEMP/apk-release/backtoschoolhelp-release.apk"
          sha256sum "$apk" > "$RUNNER_TEMP/apk-release/SHA256SUMS.txt"
          cp "$RUNNER_TEMP/apk-badging.txt" "$RUNNER_TEMP/apk-release/"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: backtoschool-help-apk
          path: ${{ runner.temp }}/apk-release/
          retention-days: 30
          if-no-files-found: error

      - name: Upload first-release signing key
        if: steps.signing.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: backtoschool-help-signing-key-FIRST-RELEASE
          path: |
            ${{ runner.temp }}/backtoschool-release.p12
            ${{ runner.temp }}/signing-key-info.txt
          retention-days: 1
          if-no-files-found: error

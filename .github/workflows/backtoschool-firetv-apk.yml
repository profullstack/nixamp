name: Build BackToSchool Fire TV APK

on:
  push:
    branches:
      - main
    paths:
      - "backtoschool-firetv/**"
      - ".github/workflows/backtoschool-firetv-apk.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to build and attach the APK to (leave blank for an artifact only)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Validate Android app before signing
        working-directory: backtoschool-firetv
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lintDebug assembleDebug

      - name: Prepare release signing key
        id: signing
        shell: bash
        env:
          SAVED_KEYSTORE_BASE64: ${{ secrets.BACKTOSCHOOL_RELEASE_KEYSTORE_BASE64 }}
          SAVED_KEYSTORE_PASSWORD: ${{ secrets.BACKTOSCHOOL_RELEASE_KEYSTORE_PASSWORD }}
          SAVED_KEY_PASSWORD: ${{ secrets.BACKTOSCHOOL_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/backtoschool-release.p12"
          if [[ -z "$SAVED_KEYSTORE_BASE64" || -z "$SAVED_KEYSTORE_PASSWORD" || -z "$SAVED_KEY_PASSWORD" ]]; then
            echo "::error::The original BackToSchool signing key and passwords are required for app updates. Configure BACKTOSCHOOL_RELEASE_KEYSTORE_BASE64, BACKTOSCHOOL_RELEASE_KEYSTORE_PASSWORD, and BACKTOSCHOOL_RELEASE_KEY_PASSWORD."
            exit 1
          fi
          printf '%s' "$SAVED_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          store_password="$SAVED_KEYSTORE_PASSWORD"
          key_password="$SAVED_KEY_PASSWORD"
          echo "::add-mask::$store_password"
          echo "::add-mask::$key_password"
          {
            echo "BACKTOSCHOOL_KEYSTORE_PATH=$keystore"
            echo "BACKTOSCHOOL_KEYSTORE_PASSWORD=$store_password"
            echo "BACKTOSCHOOL_KEY_ALIAS=backtoschool"
            echo "BACKTOSCHOOL_KEY_PASSWORD=$key_password"
          } >> "$GITHUB_ENV"

      - name: Lint and build signed release
        working-directory: backtoschool-firetv
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lintRelease assembleRelease

      - name: Validate signed APK
        shell: bash
        run: |
          set -euo pipefail
          apk="backtoschool-firetv/app/build/outputs/apk/release/app-release.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$apksigner" verify --verbose --print-certs "$apk"
          "$aapt" dump badging "$apk" | tee "$RUNNER_TEMP/apk-badging.txt"
          mkdir -p "$RUNNER_TEMP/apk-release"
          cp "$apk" "$RUNNER_TEMP/apk-release/backtoschoolhelp-release.apk"
          (cd "$RUNNER_TEMP/apk-release" && sha256sum backtoschoolhelp-release.apk > SHA256SUMS.txt)
          cp "$RUNNER_TEMP/apk-badging.txt" "$RUNNER_TEMP/apk-release/"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: backtoschool-help-apk
          path: ${{ runner.temp }}/apk-release/
          retention-days: 30
          if-no-files-found: error

      - name: Attach APK to the release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/apk-release/backtoschoolhelp-release.apk" "$RUNNER_TEMP/apk-release/SHA256SUMS.txt"

name: Release

# Tag a version and this builds everything the installers download, publishes
# the CLI to npm, and attaches the assets to the release. The installers resolve
# "latest" from the GitHub release, so nothing is installable until this has run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.1.0"
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  cli:
    name: CLI tarball and npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # electron is a devDependency of the desktop workspace and this job does
      # not build the desktop app; skipping its runtime saves most of the time.
      - run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: bun run build
      - run: bun run web:build
      - run: bun run backtoschool:build
      - run: bun test test web/test
      # Prove the OpenStream envelope on the build we are about to ship, and
      # gate the release on it: the command exits non-zero if any codec that
      # applied fails to restore byte-for-byte. The report is attached to the
      # release below and published to logicsrc.com/docs/openstream/reports.
      # Run through the built CLI (node, dist) so it is the shipped code.
      - name: OpenStream benchmark report
        run: |
          set -eu
          v=$(node -p "require('./package.json').version")
          node bin/nixamp.mjs compression benchmark --out release
          mv release/openstream-report.json "release/openstream-report-${v}.json"
          mv release/openstream-report.md "release/openstream-report-${v}.md"
      - run: bun run pack:cli
      # Run what we are about to ship, somewhere else, with the Node a user
      # has rather than the bun that built it. 0.3.0 and 0.4.0 both published a
      # tarball whose node_modules held one of its five dependencies, and both
      # installed perfectly and then died on the first import. Everything else
      # in this job passed for both.
      - name: The tarball runs
        run: |
          set -eu
          mkdir -p /tmp/cli-check
          tar -xzf release/nixamp-cli-*.tar.gz -C /tmp/cli-check
          cd /tmp/cli-check/nixamp-cli-*
          test "$(node bin/nixamp.mjs --version)" = "$(node -p "require('./package.json').version")"
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: |
            release/*.tar.gz
            release/openstream-report-*.json
            release/openstream-report-*.md

  desktop:
    name: Desktop ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not cost the other four their artifacts.
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: ubuntu-latest
            flags: --linux --x64
          # Native arm64 rather than cross-compiling: electron-builder repacks a
          # prebuilt Electron, and the packaging tools it shells out to are the
          # part that does not cross cleanly.
          - label: linux-arm64
            os: ubuntu-24.04-arm
            flags: --linux --arm64
          - label: mac-x64
            os: macos-15-intel
            flags: --mac --x64
          - label: mac-arm64
            os: macos-latest
            flags: --mac --arm64
          - label: win-x64
            os: windows-latest
            flags: --win --x64
          - label: win-arm64
            os: windows-latest
            flags: --win --arm64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run web:build
      # The desktop app carries the CLI's version, whatever desktop/package.json
      # says: 0.9.8 and 0.9.9 shipped installers still named 0.9.7, which the
      # installer then could not find at the version it had just asked for.
      - name: Desktop version follows the CLI's
        run: node -e "const fs=require('fs');const v=require('./package.json').version;const p='desktop/package.json';const d=JSON.parse(fs.readFileSync(p,'utf8'));d.version=v;fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n')"
      - run: bun run --filter '@nixamp/desktop' stage
      # Unsigned on purpose: there is no signing identity or certificate.
      # electron-builder is configured with a null mac identity so it does not
      # look for one, and Windows will warn through SmartScreen until there is.
      - name: electron-builder ${{ matrix.flags }}
        working-directory: desktop
        run: bunx electron-builder ${{ matrix.flags }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          if-no-files-found: error
          path: |
            desktop/release/*.tar.gz
            desktop/release/*.zip
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.dmg
            desktop/release/*.exe

  publish:
    name: Attach to the release
    # The CLI tarball is what install.sh needs, so it must be there. A desktop
    # build that failed on one platform should not hold back the other five.
    needs: [cli, desktop]
    if: always() && needs.cli.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: assets
      - name: One flat directory
        run: |
          mkdir -p out
          find assets -type f \
            \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.AppImage' \
               -o -name '*.deb' -o -name '*.dmg' -o -name '*.exe' \
               -o -name 'openstream-report-*.json' -o -name 'openstream-report-*.md' \) \
            -exec cp {} out/ \;
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: out/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  publish-report:
    name: Publish the benchmark report to LogicSRC
    # Separate and non-blocking: opening the reports PR must never hold back or
    # fail a release. Runs only if the CLI job (which produced the report)
    # succeeded, and does nothing at all until a LogicSRC write token is set,
    # so an unconfigured repo skips every step cleanly.
    needs: [cli]
    if: always() && needs.cli.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Is a LogicSRC write token configured
        id: guard
        env:
          TOKEN: ${{ secrets.LOGICSRC_PUBLISH_TOKEN }}
        run: echo "have=${TOKEN:+yes}" >> "$GITHUB_OUTPUT"
      - if: steps.guard.outputs.have == 'yes'
        uses: actions/download-artifact@v5
        with:
          name: cli
          path: assets
      - if: steps.guard.outputs.have == 'yes'
        uses: actions/checkout@v5
        with:
          repository: profullstack/logicsrc
          token: ${{ secrets.LOGICSRC_PUBLISH_TOKEN }}
          path: logicsrc
      - name: Open a reports PR on LogicSRC
        if: steps.guard.outputs.have == 'yes'
        env:
          GH_TOKEN: ${{ secrets.LOGICSRC_PUBLISH_TOKEN }}
        run: |
          set -eu
          raw="${{ github.event.inputs.tag || github.ref_name }}"
          v="${raw#v}"
          id="$(date -u +%Y-%m-%d)-nixamp-${v}"
          cd logicsrc
          mkdir -p docs/openstream/reports
          cp ../assets/openstream-report-*.json "docs/openstream/reports/${id}.json"
          cp ../assets/openstream-report-*.md "docs/openstream/reports/${id}.md"
          git config user.name "nixamp-release"
          git config user.email "bot@profullstack.com"
          branch="openstream-report-${id}"
          git checkout -b "$branch"
          git add docs/openstream/reports
          git commit -m "docs: OpenStream benchmark report for nixamp ${v}"
          git push origin "$branch"
          gh pr create --repo profullstack/logicsrc --base master --head "$branch" \
            --title "docs: OpenStream benchmark report for nixamp ${v}" \
            --body "Automated from the nixamp ${v} release. The envelope over the built-in corpus on the release runner; round-trip exactness gated the release."

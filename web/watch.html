<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Live · nixamp</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#080c09" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
    <!-- WebMCP (@profullstack/webmcp): site tools + the account's /mcp tools (session cookie) for the AI agent in the visitor's browser. -->
    <script type="module" data-webmcp src="https://cdn.jsdelivr.net/npm/@profullstack/webmcp@0/src/embed.js" data-mcp="/mcp" data-mcp-exclude="class_delete,station_unpublish,library_scan" data-pages='{"guide":"/guide","radio":"/radio","music":"/music","watch":"/watch","vod":"/vod"}'></script>
  </head>
  <body>
    <main class="station-app">
      <div class="station-card">
        <span id="state" class="station-chip unavailable" role="status">Loading</span>
        <div id="stage" class="station-stage"></div>
        <h1 id="name">&nbsp;</h1>
        <p id="about" class="station-about" hidden></p>
        <div class="station-now" aria-live="polite"><div id="title" class="station-title"></div><div id="by" class="station-by"></div></div>
        <p class="station-small"><a id="nixamp" href="https://nixamp.com">Open in nixamp</a> · <a id="raw" href="#">Open in another player</a> · Pausing here does not pause the room.</p>
      </div>
      <p class="station-small"><a href="/">More on the air</a> · Played by <a href="https://nixamp.com">nixamp</a>.</p>
      <div id="announce" class="sr-only" aria-live="assertive"></div>
    </main>
    <script type="module" src="/src/watch.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Music · nixamp</title>
    <meta name="description" content="AI music on nixamp: live genre stations, artists and their bands, albums with lyrics, follow and buy. Listening is free." />
    <meta name="theme-color" content="#080c09" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
    <link rel="manifest" href="/music.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/music/apple-touch-icon.png" />
  </head>
  <body>
    <a class="skip" href="#view">Skip to the music</a>
    <div id="sr-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    <header class="top">
      <a class="brand" href="/music"><img src="/logo.png" alt="" width="20" height="20" decoding="async" />nixamp <span>music</span></a>
      <nav aria-label="Music">
        <a href="/music" data-nav="home">Home</a>
        <a href="/music/me" data-nav="me">My music</a>
        <a href="/radio" class="muted">Manage</a>
      </nav>
      <span id="who" class="who"></span>
    </header>
    <main id="view" class="view" tabindex="-1" aria-live="polite"></main>
    <footer class="foot">Listening is free, with a short break every 10 minutes. Songs 10¢, albums $1, an artist's catalogue $2, paid with crypto through CoinPay. ℗ Profullstack, Inc. Music and words made with AI.</footer>
    <section id="player" class="player" aria-label="Player" hidden>
      <img id="player-art" class="player-art" alt="" width="56" height="56" />
      <div class="player-text">
        <strong id="player-title"></strong>
        <span id="player-by"></span>
      </div>
      <div class="player-controls">
        <button id="player-toggle" type="button" class="round" aria-label="Pause">❚❚</button>
        <div id="player-progress" class="player-progress" hidden>
          <span id="player-at" class="time">0:00</span>
          <progress id="player-bar" max="1" value="0" aria-label="How far into this song"></progress>
          <span id="player-length" class="time">0:00</span>
        </div>
        <span id="player-break" class="muted break" hidden>A short break</span>
      </div>
      <div class="player-side">
        <button id="player-mute" type="button" class="icon" aria-label="Mute" aria-pressed="false">🔊</button>
        <input id="player-volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume" />
        <button id="player-lyrics" type="button" class="ghost" aria-expanded="false" aria-controls="lyrics-panel">Lyrics</button>
      </div>
      <audio id="audio" preload="none"></audio>
    </section>
    <aside id="lyrics-panel" class="lyrics-panel" aria-label="Lyrics" hidden>
      <div class="lyrics-head">
        <h2 id="lyrics-title">Lyrics</h2>
        <label id="lyrics-follow-box" class="follow" hidden><input id="lyrics-follow" type="checkbox" checked /> Follow along</label>
      </div>
      <div id="lyrics-text" class="lyrics-text"></div>
    </aside>
    <script type="module" src="/src/music.ts"></script>
  </body>
</html>
